<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UniSkill Exchange — Peer Skill Sharing Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0E9;
  --paper-raised:#FFFFFF;
  --ink:#1B241E;
  --ink-soft:#4B564E;
  --forest:#1F4D3A;
  --forest-deep:#153627;
  --gold:#C79A3B;
  --gold-soft:#E8CE93;
  --indigo:#33477A;
  --line:#DAD9CC;
  --shadow:0 1px 2px rgba(27,36,30,.06), 0 8px 24px rgba(27,36,30,.06);
  --radius:16px;
  --radius-sm:10px;
  --font-display:'Fraunces', 'Georgia', serif;
  --font-body:'Public Sans','Inter',-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
.theme-dark{
  --paper:#131A15;
  --paper-raised:#1B241E;
  --ink:#EDEFE7;
  --ink-soft:#AAB4A9;
  --forest:#2E6B4E;
  --forest-deep:#0F1F17;
  --gold:#D9B458;
  --gold-soft:#5A4B26;
  --indigo:#7789C4;
  --line:#2B362E;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box;}
html,body,#root{height:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); color:var(--ink); margin:0 0 .3em; font-weight:600; letter-spacing:-.01em;}
p{line-height:1.55; margin:.2em 0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}
a{color:inherit;}
::selection{background:var(--gold-soft);}

.muted{color:var(--ink-soft); font-size:13.5px;}
.center-text{text-align:center;}
.center-row{justify-content:center;}

.eyebrow{
  font-family:var(--font-mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:11.5px;
  color:var(--gold);
  font-weight:600;
  margin-bottom:.6em;
}

/* ===== Buttons ===== */
.btn{
  border:1px solid transparent;
  border-radius:999px;
  padding:10px 18px;
  font-size:14px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--forest); color:#fff;}
.btn-primary:hover{background:var(--forest-deep);}
.btn-outline{background:transparent; border-color:var(--line); color:var(--ink);}
.btn-outline:hover{border-color:var(--forest);}
.btn-ghost{background:transparent; color:var(--ink-soft);}
.btn-ghost:hover{color:var(--ink);}
.btn-lg{padding:14px 26px; font-size:15.5px;}
.btn-sm{padding:7px 12px; font-size:12.5px;}
.btn-demo-cta{background:var(--gold); color:var(--forest-deep); border-radius:12px; margin:14px; padding:12px; font-weight:700;}
.btn[disabled]{opacity:.4; cursor:not-allowed;}
.icon-btn{
  background:transparent; border:1px solid var(--line); border-radius:10px;
  width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; font-size:15px;
}
.link-btn{background:none; border:none; color:var(--indigo); font-weight:600; font-size:13px;}

/* ===== Landing ===== */
.landing{max-width:1080px; margin:0 auto; padding:24px 24px 80px;}
.landing-nav{display:flex; justify-content:space-between; align-items:center; padding:10px 0 40px;}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; font-family:var(--font-display); font-size:18px;}
.brand-mark{
  width:38px; height:38px; border-radius:50%; background:var(--forest); color:var(--gold-soft);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:14px;
  box-shadow:0 0 0 3px var(--gold-soft), 0 0 0 4px var(--forest);
}
.landing-hero{text-align:center; padding:20px 0 56px;}
.landing-hero h1{font-size:44px; line-height:1.12; max-width:760px; margin:0 auto .3em;}
.landing-sub{max-width:600px; margin:0 auto 28px; color:var(--ink-soft); font-size:16px;}
.landing-actions{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
.landing-register-link{background:none; border:none; color:var(--indigo); margin-top:18px; font-size:13.5px; font-weight:600;}

.landing-diagram{display:flex; flex-direction:column; align-items:center; gap:4px; padding:20px 0;}
.diagram-node{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:12px 22px;
  display:flex; align-items:center; gap:10px; box-shadow:var(--shadow); min-width:260px; justify-content:center;
}
.diagram-icon{font-size:20px;}
.diagram-label{font-weight:600; font-size:14.5px;}
.diagram-arrow{color:var(--gold); font-size:16px; padding:2px 0;}

/* ===== Auth ===== */
.auth-wrap{min-height:100%; display:flex; align-items:center; justify-content:center; padding:32px 16px;}
.auth-card{background:var(--paper-raised); border-radius:var(--radius); box-shadow:var(--shadow); max-width:640px; width:100%; padding:32px;}
.auth-steps{display:flex; gap:20px; margin-bottom:26px; flex-wrap:wrap;}
.auth-step{display:flex; align-items:center; gap:8px; color:var(--ink-soft); font-size:13px; font-weight:600;}
.auth-step.active{color:var(--forest);}
.auth-step.done{color:var(--gold);}
.auth-step-dot{width:22px; height:22px; border-radius:50%; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px;}
.auth-step.active .auth-step-dot{background:var(--forest); color:#fff; border-color:var(--forest);}
.auth-step.done .auth-step-dot{background:var(--gold); color:var(--forest-deep); border-color:var(--gold);}
.auth-form h2{margin-bottom:4px;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:18px 0;}
.form-grid label{display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:600; color:var(--ink-soft);}
.form-grid input, .form-grid select, .form-grid textarea{
  border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--paper); color:var(--ink);
}
.form-grid textarea{grid-column:1/-1; min-height:80px; resize:vertical;}
.auth-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
.onboarding-cols{display:grid; grid-template-columns:1fr 1fr; gap:24px; margin:16px 0;}
.onboarding-cols h4{margin-bottom:10px;}

/* ===== Chips / tags ===== */
.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0;}
.chip{
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
}
.chip-alt{border-color:var(--indigo); color:var(--indigo);}
.chip-active{background:var(--forest); color:#fff; border-color:var(--forest);}
.chip.chip-alt.chip-active{background:var(--indigo); color:#fff;}
.chip-static{cursor:default;}
.chip-x{background:none; border:none; color:inherit; font-size:11px; margin-left:2px;}
.tag{background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:3px 9px; font-size:11.5px; font-weight:600; color:var(--ink-soft);}

/* ===== Shell ===== */
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:236px; background:var(--forest-deep); color:#EFF0E5; display:flex; flex-direction:column; flex-shrink:0;
  position:sticky; top:0; height:100vh;
}
.sidebar-brand{padding:20px; color:#fff;}
.sidebar-brand .brand-name{font-size:16px;}
.sidebar-nav{flex:1; overflow-y:auto; padding:6px 12px; display:flex; flex-direction:column; gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:10px; background:none; border:none; color:#C7CFC4;
  padding:10px 12px; border-radius:10px; font-size:13.5px; font-weight:600; text-align:left; position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item-active{background:var(--forest); color:#fff;}
.nav-icon{font-size:15px; width:18px; text-align:center;}
.nav-badge{position:absolute; right:10px; background:var(--gold); color:var(--forest-deep); font-size:10px; font-weight:800; border-radius:999px; padding:1px 6px;}
.shell-main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; gap:14px; padding:14px 24px; border-bottom:1px solid var(--line);
  position:sticky; top:0; background:var(--paper); z-index:5;
}
.topbar-title{font-family:var(--font-display); font-size:19px; font-weight:600; flex:1;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.topbar-user{display:flex; align-items:center; gap:8px; background:none; border:none; font-weight:700; font-size:13.5px;}
.page-content{padding:24px; flex:1;}
.mobile-only{display:none;}
.bottom-nav{position:fixed; bottom:0; left:0; right:0; background:var(--paper-raised); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:8px 0; z-index:20;}
.bottom-nav-item{background:none; border:none; font-size:20px; padding:4px 14px; border-radius:10px;}
.bottom-nav-item.active{background:var(--gold-soft);}

/* ===== Generic layout ===== */
.page-stack{display:flex; flex-direction:column; gap:20px; max-width:1180px;}
.page-toolbar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
.panel{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow);}
.panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.stack-list{display:flex; flex-direction:column; gap:10px;}

/* ===== Dashboard ===== */
.dash-hero{display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap; background:linear-gradient(135deg,var(--forest),var(--forest-deep)); color:#fff; border-radius:var(--radius); padding:26px; box-shadow:var(--shadow);}
.dash-hero h2{color:#fff; margin-bottom:4px;}
.dash-hero p{color:#D6DCCF;}
.dash-hero-stats{display:flex; gap:20px; flex-wrap:wrap;}
.hero-stat{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:#CBD3C2; font-weight:600;}
.hero-stat-plain{font-weight:700; color:#fff; font-size:14px;}
.rank-progress-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px;}
.rank-progress-head{display:flex; justify-content:space-between; font-weight:700; margin-bottom:10px;}
.progress-bar{height:8px; border-radius:999px; background:var(--paper); overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--forest)); border-radius:999px; transition:width .4s ease;}
.mini-student-row{display:flex; align-items:center; gap:10px; padding:8px; border-radius:12px;}
.mini-student-row:hover{background:var(--paper);}
.mini-student-info{display:flex; flex-direction:column; flex:1; min-width:0;}
.mini-student-info strong{font-size:13.5px;}
.match-tag{background:var(--gold-soft); color:var(--forest-deep); font-weight:700; font-size:11.5px; padding:4px 9px; border-radius:999px;}
.mini-task-row{display:flex; justify-content:space-between; align-items:center; padding:8px; border-radius:12px; background:var(--paper);}
.lb-rank{font-size:16px; width:20px;}
.notif-row{display:flex; gap:8px; font-size:13px; padding:6px 4px;}

/* ===== Avatar / coin / rank atoms ===== */
.avatar-circle{border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--font-display); flex-shrink:0;}
.rank-pill{display:inline-flex; align-items:center; gap:5px; background:color-mix(in srgb, var(--rank-color) 18%, transparent); color:var(--rank-color); border:1px solid var(--rank-color); font-weight:700; font-size:12px; padding:4px 10px; border-radius:999px;}
.coin-tag{display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-weight:700; color:var(--forest); background:var(--gold-soft); padding:4px 10px; border-radius:999px; font-size:12.5px;}
.coin-tag-lg{font-size:22px; padding:8px 18px;}
.stat-block{background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center; flex:1;}
.stat-value{font-family:var(--font-display); font-size:24px; font-weight:700;}
.stat-label{font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-top:2px;}
.stat-row{display:flex; gap:12px; flex-wrap:wrap;}
.stat-row-wide .stat-block{min-width:120px;}

/* ===== Discover ===== */
.discover-controls{display:flex; gap:10px; flex-wrap:wrap;}
.search-input{flex:1; min-width:220px; border:1px solid var(--line); border-radius:10px; padding:10px 14px; background:var(--paper);}
.discover-controls select{border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--paper);}
.student-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px;}
.student-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow);}
.student-card-top{display:flex; align-items:center; gap:10px;}
.student-card-skills{display:flex; flex-wrap:wrap; gap:6px;}
.student-card-meta{display:flex; gap:10px; font-size:12px; color:var(--ink-soft); flex-wrap:wrap;}
.student-card-actions{display:flex; gap:6px; flex-wrap:wrap;}
.exchange-strip{background:var(--indigo); color:#fff; border:none; border-radius:10px; padding:8px; font-size:12px; font-weight:700;}
.profile-modal-head{display:flex; gap:16px; align-items:center; margin-bottom:16px;}

/* ===== Skills page ===== */
.skill-row{display:flex; justify-content:space-between; align-items:center; background:var(--paper); border-radius:10px; padding:10px 12px;}
.level-badge{margin-left:10px; font-size:11px; color:var(--ink-soft); font-weight:600;}
.add-skill-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.add-skill-row select{border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--paper);}

/* ===== Requests ===== */
.request-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
.request-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.responses{margin:10px 0;}
.response-row{display:flex; align-items:center; gap:8px; font-size:13px; background:var(--paper); padding:8px 10px; border-radius:10px;}
.request-actions{display:flex; gap:8px; margin-top:10px;}
.request-actions input{flex:1; border:1px solid var(--line); border-radius:10px; padding:8px 12px; background:var(--paper);}

/* ===== Tasks ===== */
.task-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px;}
.task-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:8px; cursor:pointer; box-shadow:var(--shadow); transition:transform .12s;}
.task-card:hover{transform:translateY(-2px);}
.task-card-top{display:flex; justify-content:space-between; align-items:center;}
.task-desc{font-size:12.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.task-card-meta{display:flex; gap:6px; flex-wrap:wrap;}
.task-card-owner{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); margin-top:auto;}
.status-pill{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:4px 9px; border-radius:999px;}
.status-open{background:#DDEBE0; color:#1F4D3A;}
.status-in_progress{background:#FCEBC7; color:#8A6A15;}
.status-submitted{background:#DCE3F5; color:#33477A;}
.status-completed{background:#E4E1EF; color:#5C4A9C;}
.lifecycle-bar{display:flex; align-items:center; margin:10px 0 18px;}
.lifecycle-step{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--ink-soft); font-weight:700;}
.lifecycle-dot{width:26px; height:26px; border-radius:50%; background:var(--paper); border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px;}
.lifecycle-step-done .lifecycle-dot{background:var(--forest); border-color:var(--forest); color:#fff;}
.lifecycle-step-done{color:var(--forest);}
.lifecycle-line{flex:1; height:2px; background:var(--line); margin:0 2px; margin-bottom:16px;}
.lifecycle-line-done{background:var(--forest);}
.task-actions-panel{margin-top:16px; padding-top:16px; border-top:1px solid var(--line);}

/* ===== Projects ===== */
.project-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
.project-head{display:flex; justify-content:space-between; align-items:center; gap:10px;}

/* ===== Chat ===== */
.chat-shell{display:grid; grid-template-columns:280px 1fr; gap:16px; height:calc(100vh - 160px); min-height:440px;}
.chat-list{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); overflow-y:auto; padding:8px;}
.chat-list-item{display:flex; gap:10px; align-items:center; width:100%; background:none; border:none; padding:10px; border-radius:10px; text-align:left;}
.chat-list-item.active, .chat-list-item:hover{background:var(--paper);}
.chat-list-info{display:flex; flex-direction:column; min-width:0;}
.chat-list-info span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px;}
.chat-panel{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); display:flex; flex-direction:column; overflow:hidden;}
.chat-panel-head{display:flex; align-items:center; gap:10px; padding:14px; border-bottom:1px solid var(--line);}
.chat-messages{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px;}
.chat-bubble{background:var(--paper); padding:10px 14px; border-radius:14px 14px 14px 4px; max-width:70%; align-self:flex-start; font-size:13.5px;}
.chat-bubble-me{background:var(--forest); color:#fff; border-radius:14px 14px 4px 14px; align-self:flex-end;}
.chat-input-row{display:flex; gap:8px; padding:12px; border-top:1px solid var(--line);}
.chat-input-row input{flex:1; border:1px solid var(--line); border-radius:999px; padding:10px 16px; background:var(--paper);}

/* ===== Leaderboard ===== */
.lb-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.lb-table th{text-align:left; color:var(--ink-soft); font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding:8px 10px; border-bottom:1px solid var(--line);}
.lb-table td{padding:10px; border-bottom:1px solid var(--line);}
.lb-name-cell{display:flex; align-items:center; gap:8px; font-weight:700;}
.lb-row-me{background:var(--gold-soft);}

/* ===== Notifications ===== */
.notif-card{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:12px 14px; position:relative; font-size:13.5px;}
.notif-unread{border-color:var(--gold);}
.notif-icon{font-size:16px;}
.notif-dot{width:8px; height:8px; border-radius:50%; background:var(--gold); margin-left:auto;}

/* ===== Profile ===== */
.profile-hero{display:flex; align-items:center; gap:18px; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); flex-wrap:wrap;}
.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-top:10px;}
.badge-card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center; display:flex; flex-direction:column; gap:4px;}
.badge-locked{opacity:.35; filter:grayscale(1);}
.badge-card-icon{font-size:26px;}
.badge-row{display:flex; flex-wrap:wrap; gap:8px;}
.badge-pill{background:var(--gold-soft); color:var(--forest-deep); padding:5px 10px; border-radius:999px; font-size:12px; font-weight:700;}

/* ===== Wallet ===== */
.wallet-balance-card{background:linear-gradient(135deg,var(--forest),var(--forest-deep)); color:#fff; border-radius:var(--radius); padding:26px; text-align:center; box-shadow:var(--shadow);}
.wallet-balance{font-family:var(--font-display); font-size:46px; font-weight:700; margin:6px 0;}
.wallet-note{max-width:460px; margin:12px auto 0; color:#D6DCCF; font-size:13px;}
.earn-grid{display:flex; flex-direction:column; gap:8px;}
.earn-grid-wide{max-width:520px; margin:0 auto;}
.earn-row{display:flex; justify-content:space-between; align-items:center; background:var(--paper); padding:10px 14px; border-radius:10px;}
.tx-row{display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px solid var(--line); font-size:13.5px;}
.tx-amount{color:var(--forest); font-weight:700; font-family:var(--font-mono);}

/* ===== Settings ===== */
.settings-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0;}
.switch{width:42px; height:24px; border-radius:999px; background:var(--line); border:none; position:relative; padding:0;}
.switch-on{background:var(--forest);}
.switch-knob{position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s ease;}
.switch-on .switch-knob{left:21px;}

/* ===== Modal ===== */
.modal-overlay{position:fixed; inset:0; background:rgba(10,15,11,.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal-card{background:var(--paper-raised); border-radius:var(--radius); padding:22px; max-width:520px; width:100%; max-height:86vh; overflow-y:auto; box-shadow:var(--shadow);}
.modal-wide{max-width:640px;}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}

/* ===== Toast ===== */
.toast-wrap{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:200;}
.toast{background:var(--forest-deep); color:#fff; padding:12px 20px; border-radius:999px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow); animation:toast-in .2s ease;}
@keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ===== Empty state ===== */
.empty-state{text-align:center; padding:30px 10px; color:var(--ink-soft);}
.empty-icon{font-size:30px; margin-bottom:8px;}
.empty-state h4{color:var(--ink); margin-bottom:4px;}

/* ===== Presentation Mode ===== */
.present-wrap{position:fixed; inset:0; background:var(--forest-deep); color:#F4F3EA; display:flex; flex-direction:column; z-index:500; overflow:hidden;}
.present-topbar{display:flex; align-items:center; gap:16px; padding:14px 22px;}
.present-section-nav{flex:1; display:flex; gap:5px; overflow-x:auto; justify-content:center;}
.present-dot{width:8px; height:8px; border-radius:50%; background:rgba(244,243,234,.25); border:none; flex-shrink:0;}
.present-dot-active{background:var(--gold); width:22px; border-radius:5px;}
.present-progress{height:3px; background:rgba(244,243,234,.12);}
.present-progress-fill{height:100%; background:var(--gold); transition:width .3s ease;}
.present-body{flex:1; overflow-y:auto; display:flex; flex-direction:column; align-items:center; padding:26px 26px 10px;}
.present-slide-counter{font-family:var(--font-mono); font-size:12px; letter-spacing:.1em; color:var(--gold); text-transform:uppercase; margin-bottom:18px;}
.present-slide{width:100%; max-width:1040px;}
.present-nav{display:flex; justify-content:space-between; align-items:center; padding:16px 26px; border-top:1px solid rgba(244,243,234,.12);}

.slide{color:#F4F3EA;}
.slide h1,.slide h2,.slide h3,.slide h4{color:#F4F3EA;}
.slide .muted{color:#B9C3B4;}
.slide-center{text-align:center; display:flex; flex-direction:column; align-items:center;}
.slide-center h1{font-size:52px;}
.slide-sub{color:var(--gold); font-weight:500;}
.slide-lead{max-width:640px; color:#D6DCCF; font-size:16px;}
.slide-callout{margin-top:18px; font-family:var(--font-display); font-size:19px; color:var(--gold-soft); max-width:640px; text-align:center;}
.final-title{font-size:44px; line-height:1.15;}

.flow-diagram{display:flex; flex-direction:column; align-items:center; gap:0; margin-top:20px;}
.flow-horizontal{flex-direction:row; flex-wrap:wrap; justify-content:center;}
.flow-node{background:rgba(244,243,234,.06); border:1px solid rgba(244,243,234,.16); border-radius:14px; padding:12px 20px; display:flex; align-items:center; gap:10px; min-width:220px; justify-content:center;}
.flow-horizontal .flow-node{min-width:150px; flex-direction:column; text-align:center; gap:6px;}
.flow-icon{font-size:19px;}
.flow-label{font-weight:600; font-size:14px;}
.flow-arrow{color:var(--gold); font-size:16px; padding:3px 0;}
.flow-horizontal .flow-arrow{padding:0 6px;}

.problem-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-top:16px;}
.problem-card{background:rgba(244,243,234,.06); border:1px solid rgba(244,243,234,.14); border-radius:16px; padding:18px;}
.problem-icon{font-size:26px; margin-bottom:8px;}
.problem-card p{color:#C9D1C4; font-size:13.5px;}
.problem-flow{margin-top:10px; font-family:var(--font-mono); font-size:11.5px; color:var(--gold-soft);}

.hub-diagram{display:flex; flex-direction:column; align-items:center; gap:24px; margin-top:10px;}
.hub-center{background:var(--gold); color:var(--forest-deep); font-family:var(--font-display); font-weight:700; border-radius:50%; width:150px; height:150px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:17px; box-shadow:0 0 0 8px rgba(199,154,59,.15);}
.hub-modules{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.hub-module{background:rgba(244,243,234,.06); border:1px solid rgba(244,243,234,.14); border-radius:14px; padding:16px; text-align:center; display:flex; flex-direction:column; gap:6px;}
.hub-module-icon{font-size:22px;}
.hub-module span{color:#C9D1C4; font-size:12.5px;}

.match-demo{display:grid; grid-template-columns:1fr auto 1fr; gap:16px; align-items:center; margin-top:16px; width:100%;}
.match-card{background:rgba(244,243,234,.06); border:1px solid rgba(244,243,234,.14); border-radius:16px; padding:18px; display:flex; flex-direction:column; align-items:center; gap:6px;}
.match-center{display:flex; flex-direction:column; align-items:center; gap:6px;}
.match-percent{font-family:var(--font-display); font-size:30px; color:var(--gold);}
.match-swap{display:flex; flex-direction:column; align-items:center; font-size:12px; color:#C9D1C4; margin-top:10px; gap:2px;}
.two-modes{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:20px; width:100%;}
.mode-card{background:rgba(244,243,234,.06); border:1px solid rgba(244,243,234,.14); border-radius:14px; padding:16px;}
.mode-card p{color:#C9D1C4; font-size:13px;}

.big-coin-counter{font-family:var(--font-display); font-size:40px; color:var(--gold); margin:18px 0;}
.rank-ladder{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin:18px 0;}
.rank-ladder-card{background:rgba(244,243,234,.06); border:1px solid var(--rank-color); border-radius:14px; padding:16px 18px; text-align:center; min-width:110px;}
.rank-ladder-icon{font-size:26px;}
.rank-ladder-card span{display:block; font-size:11px; color:#C9D1C4; margin-top:4px;}
.sample-profile-card{display:flex; align-items:center; gap:14px; background:rgba(244,243,234,.06); border:1px solid rgba(244,243,234,.14); border-radius:14px; padding:16px 20px;}

.unique-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-top:16px;}
.unique-card{background:rgba(244,243,234,.06); border:1px solid rgba(244,243,234,.14); border-radius:16px; padding:18px;}
.unique-icon{font-size:24px; margin-bottom:8px;}
.unique-card p{color:#C9D1C4; font-size:13px;}

.tech-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0;}
.tech-row{display:flex; justify-content:space-between; background:rgba(244,243,234,.06); border-radius:10px; padding:10px 14px; font-size:13px;}

.journey-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:16px 0;}
.journey-col{background:rgba(244,243,234,.06); border:1px solid rgba(244,243,234,.14); border-radius:14px; padding:16px;}
.journey-col p{color:#C9D1C4; font-size:13px;}

.ecosystem-diagram{display:flex; flex-direction:column; align-items:center; gap:4px;}
.eco-row{display:flex; gap:10px; justify-content:center; width:100%;}
.eco-pair{gap:24px;}
.eco-node{background:rgba(244,243,234,.07); border:1px solid rgba(244,243,234,.16); border-radius:10px; padding:9px 18px; font-size:12.5px; font-weight:600;}
.eco-top{background:var(--gold); color:var(--forest-deep); font-weight:700;}
.eco-highlight{border-color:var(--gold); color:var(--gold);}

.chat-demo{display:flex; flex-direction:column; gap:8px; max-width:420px; margin:18px 0;}
.chat-demo .chat-bubble{background:rgba(244,243,234,.08); color:#F4F3EA;}
.chat-demo .chat-bubble-me{background:var(--gold); color:var(--forest-deep);}

/* ===== Responsive ===== */
@media (max-width: 900px){
  .grid-2{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .onboarding-cols{grid-template-columns:1fr;}

  .chat-list{max-height:180px;}

  .journey-grid{grid-template-columns:1fr;}
  .tech-grid{grid-template-columns:1fr;}
  .hub-modules{grid-template-columns:1fr 1fr;}
}
@media (max-width: 760px){
  .sidebar{position:fixed; left:-260px; top:0; bottom:0; z-index:50; transition:left .2s ease; width:230px;}

  .mobile-only{display:flex;}
  .mobile-hide{display:none;}
  .page-content{padding:16px; padding-bottom:76px;}
  .topbar{padding:12px 16px;}
  .landing-hero h1{font-size:30px;}
  .slide-center h1{font-size:32px;}
  .final-title{font-size:30px;}
  .present-body{padding:18px 16px 10px;}
}
